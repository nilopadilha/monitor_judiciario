openapi: 3.1.0
info:
  title: Monitor Judicial API
  description: Monitoramento de processos judiciais via DJEN. Padrões de API do PJe;
    erros em RFC 9457 Problem Details.
  version: v1
servers:
- url: http://localhost
  description: Generated server url
security:
- bearer: []
paths:
  /api/v1/processes/{id}:
    get:
      tags:
      - Processos
      summary: Detalha processo
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProcessView"
    put:
      tags:
      - Processos
      summary: Altera assunto e status (ACTIVE/PAUSED)
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProcessRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProcessView"
    delete:
      tags:
      - Processos
      summary: "Arquiva processo (encerra o monitoramento, preserva histórico)"
      operationId: archive
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/clients/{id}:
    get:
      tags:
      - Clientes
      summary: Detalha cliente
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClientView"
    put:
      tags:
      - Clientes
      summary: Altera cliente (o documento não muda)
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClientView"
    delete:
      tags:
      - Clientes
      summary: "Inativa cliente (exclusão lógica, preserva histórico)"
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/users:
    get:
      tags:
      - Usuários
      summary: Lista usuários
      operationId: list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultUserView"
    post:
      tags:
      - Usuários
      summary: Cria usuário (CUSTOMER exige clientId)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserView"
  /api/v1/tribunal-synchronizations:
    post:
      tags:
      - Tribunais
      summary: Sincroniza a lista de tribunais estaduais com o DJEN
      operationId: synchronize
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SynchronizationResult"
  /api/v1/tokens:
    post:
      tags:
      - Autenticação
      summary: Emite tokens por senha (login) ou por refresh token (renovação com
        rotação)
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenPair"
  /api/v1/token-revocations:
    post:
      tags:
      - Autenticação
      summary: "Revoga o refresh token e toda a sua cadeia (logout), no modelo da\
        \ RFC 7009"
      operationId: revoke
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRevocationRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/v1/processes:
    get:
      tags:
      - Processos
      summary: Lista processos (CUSTOMER vê apenas os do seu cliente)
      operationId: list_1
      parameters:
      - name: clientId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - ARCHIVED
      - name: courtCode
        in: query
        required: false
        schema:
          type: string
      - name: number
        in: query
        required: false
        schema:
          type: string
      - name: situation
        in: query
        required: false
        schema:
          type: string
          enum:
          - ARCHIVED
          - PAUSED
          - FAILED
          - NEW_PUBLICATION
          - MONITORED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultProcessView"
    post:
      tags:
      - Processos
      summary: Cadastra processo pelo número CNJ; o tribunal é derivado do número
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProcessRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProcessView"
  /api/v1/notifications:
    get:
      tags:
      - Notificações
      summary: Lista notificações (CUSTOMER vê apenas as suas)
      operationId: list_2
      parameters:
      - name: processId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: channel
        in: query
        required: false
        schema:
          type: string
          enum:
          - EMAIL
          - WHATSAPP
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultNotificationView"
    post:
      tags:
      - Notificações
      summary: Envia notificação manual ao cliente do processo
      operationId: send
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationView"
  /api/v1/monitoring-executions:
    get:
      tags:
      - Monitoramento
      summary: "Lista execuções de monitoramento, mais recentes primeiro"
      operationId: list_3
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultMonitoringExecutionView"
    post:
      tags:
      - Monitoramento
      summary: Inicia uma execução manual (assíncrona). 409 se já houver uma em andamento
      operationId: start
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MonitoringExecutionView"
  /api/v1/clients:
    get:
      tags:
      - Clientes
      summary: Lista clientes (busca por nome ou documento)
      operationId: list_4
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultClientView"
    post:
      tags:
      - Clientes
      summary: Cadastra cliente
      operationId: create_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClientView"
  /api/v1/tribunals/{code}:
    patch:
      tags:
      - Tribunais
      summary: Ativa ou desativa o monitoramento de um tribunal
      operationId: patch
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TribunalPatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TribunalView"
  /api/v1/publications/{id}:
    get:
      tags:
      - Publicações
      summary: Detalha publicação
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicationView"
    patch:
      tags:
      - Publicações
      summary: Marca publicação como lida
      operationId: patch_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationPatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicationView"
  /api/v1/users/{id}:
    get:
      tags:
      - Usuários
      summary: Detalha usuário
      operationId: get_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserView"
  /api/v1/users/me:
    get:
      tags:
      - Usuários
      summary: Usuário autenticado
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserView"
  /api/v1/tribunals:
    get:
      tags:
      - Tribunais
      summary: Lista tribunais
      operationId: list_5
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TribunalView"
  /api/v1/publications:
    get:
      tags:
      - Publicações
      summary: Lista publicações (CUSTOMER vê apenas as do seu cliente)
      operationId: list_6
      parameters:
      - name: processId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: unread
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultPublicationView"
  /api/v1/processes/{processId}/movements:
    get:
      tags:
      - Processos
      summary: Linha do tempo de movimentações do processo
      operationId: list_7
      parameters:
      - name: processId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultMovementView"
  /api/v1/monitoring-executions/{id}:
    get:
      tags:
      - Monitoramento
      summary: Detalha execução com o resultado por processo
      operationId: get_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MonitoringExecutionView"
  /api/v1/dashboard-summary:
    get:
      tags:
      - Painel
      summary: Indicadores do painel; CUSTOMER recebe apenas os dados do seu cliente
      operationId: summary
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /api/v1/audit-logs:
    get:
      tags:
      - Auditoria
      summary: Consulta a trilha de auditoria
      operationId: list_8
      parameters:
      - name: resourceType
        in: query
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        required: false
        schema:
          type: string
      - name: actorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultAuditLog"
components:
  schemas:
    UpdateProcessRequest:
      type: object
      properties:
        subject:
          type: string
          maxLength: 300
          minLength: 0
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - ARCHIVED
      required:
      - status
    ProcessView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        clientName:
          type: string
        number:
          type: string
        courtCode:
          type: string
        subject:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - ARCHIVED
        situation:
          type: string
          enum:
          - ARCHIVED
          - PAUSED
          - FAILED
          - NEW_PUBLICATION
          - MONITORED
        unreadPublications:
          type: integer
          format: int64
        lastError:
          type: string
        lastCheckedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ClientRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 0
        document:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          maxLength: 20
          minLength: 0
        notifyEmail:
          type: boolean
        notifyWhatsapp:
          type: boolean
      required:
      - document
      - email
      - name
    ClientView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        document:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        notifyEmail:
          type: boolean
        notifyWhatsapp:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 128
          minLength: 12
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - CUSTOMER
        clientId:
          type: string
          format: uuid
      required:
      - email
      - name
      - password
      - role
    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - CUSTOMER
        clientId:
          type: string
          format: uuid
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SynchronizationResult:
      type: object
      properties:
        received:
          type: integer
          format: int32
        created:
          type: integer
          format: int32
        updated:
          type: integer
          format: int32
    TokenRequest:
      type: object
      properties:
        grantType:
          type: string
          enum:
          - PASSWORD
          - REFRESH_TOKEN
        email:
          type: string
        password:
          type: string
        refreshToken:
          type: string
      required:
      - grantType
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        tokenType:
          type: string
    TokenRevocationRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    RegisterProcessRequest:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        number:
          type: string
          minLength: 1
        subject:
          type: string
          maxLength: 300
          minLength: 0
      required:
      - clientId
      - number
    SendNotificationRequest:
      type: object
      properties:
        processId:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - EMAIL
          - WHATSAPP
        message:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - channel
      - message
      - processId
    NotificationView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        processId:
          type: string
          format: uuid
        processNumber:
          type: string
        clientId:
          type: string
          format: uuid
        clientName:
          type: string
        channel:
          type: string
          enum:
          - EMAIL
          - WHATSAPP
        recipient:
          type: string
        subject:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
        attempts:
          type: integer
          format: int32
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
    JobView:
      type: object
      properties:
        processId:
          type: string
          format: uuid
        processNumber:
          type: string
        status:
          type: string
        executionTimeMs:
          type: integer
          format: int64
        newPublications:
          type: integer
          format: int32
        errorMessage:
          type: string
    MonitoringExecutionView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trigger:
          type: string
          enum:
          - SCHEDULED
          - MANUAL
        triggeredBy:
          type: string
        status:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - COMPLETED_WITH_FAILURES
          - FAILED
          - ABORTED
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        processesChecked:
          type: integer
          format: int32
        newPublications:
          type: integer
          format: int32
        failedJobs:
          type: integer
          format: int32
        errorMessage:
          type: string
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobView"
    TribunalPatchRequest:
      type: object
      properties:
        active:
          type: boolean
      required:
      - active
    TribunalView:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        state:
          type: string
        active:
          type: boolean
    PublicationPatchRequest:
      type: object
      properties:
        read:
          type: boolean
      required:
      - read
    PublicationView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        processId:
          type: string
          format: uuid
        processNumber:
          type: string
        courtCode:
          type: string
        publicationDate:
          type: string
          format: date
        communicationType:
          type: string
        documentType:
          type: string
        organName:
          type: string
        content:
          type: string
        link:
          type: string
        source:
          type: string
        read:
          type: boolean
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PageResultUserView:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserView"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
